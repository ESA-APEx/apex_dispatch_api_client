site_name: APEx Dispatch API Client
site_description: Python client for the APEx Dispatch API
site_url: https://esa-apex.github.io/apex_dispatch_api_client/
repo_url: https://github.com/ESA-APEx/apex_dispatch_api_client
repo_name: ESA-APEx/apex_dispatch_api_client
edit_uri: edit/main/docs/

theme:
  logo: imgs/icon-eoap.png
  name: material

  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    toggle:
      icon: material/toggle-switch-off-outline
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    toggle:
      icon: material/toggle-switch
      name: Switch to light mode

nav:
  - Home: index.md
  - Tutorials:
      - Submit your first processing job: tutorials/first-processing-job.md
  - How-to guides:
      - Configure clients: how-to/configure-clients.md
      - Submit processing jobs: how-to/submit-processing-jobs.md
      - Inspect jobs and results: how-to/inspect-jobs-and-results.md
      - Use async calls: how-to/use-async.md
      - Handle errors: how-to/handle-errors.md
  - Reference:
      - Clients: reference/clients.md
      - Operations: reference/operations.md
      - Models: reference/models.md
  - Explanation:
      - Generated client architecture: explanation/generated-client.md
      - Data models and extra fields: explanation/data-models.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
